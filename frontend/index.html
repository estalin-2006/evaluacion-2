<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #00f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      border: 2px solid #00f;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
      background-color: #000;
      box-shadow: 0 0 10px #00f;
    }
    .login-container h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .login-container label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .login-container input, .login-container select {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      border: 1px solid #00f;
      border-radius: 4px;
      background-color: #000;
      color: #00f;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #00f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .login-container button:hover {
      background-color: #005;
    }
    .login-container a {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #00f;
      text-decoration: none;
    }
    .login-container a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="catalog.js"></script>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqwYsEPlbITomMRrxwBEWiJaVeQA99654",
      authDomain: "mini-catalogo-e3017.firebaseapp.com",
      projectId: "mini-catalogo-e3017",
      storageBucket: "mini-catalogo-e3017.appspot.com",
      messagingSenderId: "630663981518",
      appId: "1:630663981518:web:7c2f7e1fdc35728882a39f",
      measurementId: "G-KZZTVT5CQ5"
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
  </script>
</head>
<body>
  <div id="backend-error" style="display:none;color:red;text-align:center;margin-bottom:20px;"></div>
  <!-- Login -->
  <div class="login-container">
    <h1>INICIAR SESIÓN</h1>
    <form id="login-form">
      <label for="login-email">Usuario:</label>
      <input type="text" id="login-email" required />

      <label for="login-password">Contraseña:</label>
      <input type="password" id="login-password" required autocomplete="current-password" />

      <div style="margin-bottom: 16px;">
        <input type="checkbox" id="remember-me" />
        <label for="remember-me">Recordarme</label>
      </div>

      <button type="submit">Iniciar Sesión</button>
      <a href="#" id="register-link">Registrarse</a>
      <a href="#">Olvidé mi contraseña</a>
    </form>
  </div>

  <!-- Modal para nuevo producto -->
  <div id="modal-nuevo" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
    <div class="bg-gradient-to-br from-indigo-800 to-purple-800 rounded-xl p-8 w-full max-w-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-cyan-300 text-2xl font-bold">Nuevo producto</h2>
        <button id="close-nuevo" class="text-pink-400 text-2xl font-bold">×</button>
      </div>
      <form id="form-nuevo" class="space-y-4">
        <label for="nuevo-nombre" class="block text-cyan-200">Nombre:</label>
        <input type="text" id="nuevo-nombre" placeholder="Nombre" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
        <label for="nuevo-precio" class="block text-cyan-200">Precio:</label>
        <input type="number" id="nuevo-precio" placeholder="Precio" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
        <label for="nuevo-descripcion" class="block text-cyan-200">Descripción:</label>
        <textarea id="nuevo-descripcion" placeholder="Descripción" class="w-full p-2 rounded bg-indigo-900 text-cyan-200"></textarea>
        <label for="nuevo-imagen" class="block text-cyan-200">Imagen:</label>
        <input type="file" id="nuevo-imagen" accept="image/*" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
        <span id="nombre-archivo" class="text-blue-500"></span>
        <div class="flex justify-end gap-4 mt-4">
          <button type="button" id="cancelar-nuevo" class="border-2 border-cyan-300 text-cyan-300 px-4 py-2 rounded-full font-bold hover:bg-cyan-300 hover:text-indigo-900 transition">Cancelar</button>
          <button type="submit" class="border-2 border-pink-400 text-pink-400 px-4 py-2 rounded-full font-bold hover:bg-pink-400 hover:text-white transition">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('nuevo-imagen').addEventListener('change', function() {
      const archivo = this.files[0];
      document.getElementById('nombre-archivo').textContent = archivo ? archivo.name : '';
    });
  </script>

  <script>
    // Desactivado: no hacer chequeo automático de backend

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        // Usar la función loginUser de catalog.js
        const credentials = { email, password };
        const response = await fetch('http://localhost:8000/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(credentials),
        });

        if (response.status === 401) {
          alert('Credenciales inválidas. Verifica tu usuario y contraseña.');
          return;
        }

        if (!response.ok) {
          throw new Error('Error al iniciar sesión');
        }

        const data = await response.json();
        if (data.success) {
          localStorage.setItem('authToken', data.token);
          alert(`Inicio de sesión exitoso como ${data.role}`);
          document.querySelector('.login-container').style.display = 'none';
          if (data.role === 'admin') {
            // Interfaz tipo dashboard para administrador
            // Cambiar el fondo del body para que cubra toda la pantalla
            document.body.style.background = 'linear-gradient(135deg, #312e81 0%, #6d28d9 100%)';
            document.body.style.minHeight = '100vh';
            document.body.style.margin = '0';
            document.body.style.display = 'flex';
            document.body.style.flexDirection = 'column';
            document.body.style.alignItems = 'center';
            document.body.style.justifyContent = 'center';
            const adminContainer = document.createElement('div');
            adminContainer.id = 'admin-dashboard';
            adminContainer.className = 'w-full h-full flex flex-col items-center justify-center';
            adminContainer.innerHTML = `
              <div class="w-full max-w-5xl bg-gradient-to-br from-indigo-800 to-purple-800 rounded-xl shadow-lg p-8 mb-8">
                <div class="flex items-center justify-between mb-6">
                  <h1 class="text-4xl font-extrabold text-cyan-300 drop-shadow flex items-center"><span class="mr-2">🎮</span> <span class="text-pink-400">Admin</span> <span class="ml-2">Productos</span></h1>
                  <button id="btn-nuevo" class="border-2 border-pink-400 text-pink-400 px-4 py-2 rounded-full font-bold hover:bg-pink-400 hover:text-white transition">Nueva producto</button>
                </div>
                <div class="flex items-center mb-4">
                  <input id="search-bar" type="text" placeholder="Buscar nombre, SKU, categoría..." class="w-full p-3 rounded-l border-none text-black" />
                  <button id="btn-buscar" class="bg-pink-400 text-white px-6 py-3 rounded-r font-bold">Buscar</button>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left rounded-xl overflow-hidden">
                    <thead class="bg-indigo-700 text-cyan-300">
                      <tr>
                        <th class="px-4 py-2">ID</th>
                        <th class="px-4 py-2">Nombre</th>
                        <th class="px-4 py-2">Imagen</th>
                        <th class="px-4 py-2">Precio</th>
                        <th class="px-4 py-2">Descripción</th>
                        <th class="px-4 py-2">Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="admin-product-list" class="bg-indigo-900 text-blue-200"></tbody>
                  </table>
                </div>
              </div>
              <!-- Modal para nuevo producto -->
              <div id="modal-nuevo" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
                <div class="bg-gradient-to-br from-indigo-800 to-purple-800 rounded-xl p-8 w-full max-w-md">
                  <div class="flex justify-between items-center mb-4">
                    <h2 class="text-cyan-300 text-2xl font-bold">Nuevo producto</h2>
                    <button id="close-nuevo" class="text-pink-400 text-2xl font-bold">×</button>
                  </div>
                  <form id="form-nuevo" class="space-y-4">
                    <label for="nuevo-nombre" class="block text-cyan-200">Nombre:</label>
                    <input type="text" id="nuevo-nombre" placeholder="Nombre" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
                    <label for="nuevo-precio" class="block text-cyan-200">Precio:</label>
                    <input type="number" id="nuevo-precio" placeholder="Precio" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
                    <label for="nuevo-descripcion" class="block text-cyan-200">Descripción:</label>
                    <textarea id="nuevo-descripcion" placeholder="Descripción" class="w-full p-2 rounded bg-indigo-900 text-cyan-200"></textarea>
                    <label for="nuevo-imagen" class="block text-cyan-200">Imagen:</label>
                    <input type="file" id="nuevo-imagen" accept="image/*" class="w-full p-2 rounded bg-indigo-900 text-cyan-200" required />
                    <span id="nombre-archivo" class="text-blue-500"></span>
                    <div class="flex justify-end gap-4 mt-4">
                      <button type="button" id="cancelar-nuevo" class="border-2 border-cyan-300 text-cyan-300 px-4 py-2 rounded-full font-bold hover:bg-cyan-300 hover:text-indigo-900 transition">Cancelar</button>
                      <button type="submit" class="border-2 border-pink-400 text-pink-400 px-4 py-2 rounded-full font-bold hover:bg-pink-400 hover:text-white transition">Guardar</button>
                    </div>
                  </form>
                </div>
              </div>
              <!-- Modal para eliminar producto -->
              <div id="modal-eliminar" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
                <div class="bg-gradient-to-br from-indigo-800 to-purple-800 rounded-xl p-8 w-full max-w-md">
                  <div class="flex justify-between items-center mb-4">
                    <h2 class="text-cyan-300 text-2xl font-bold">Eliminar producto</h2>
                    <button id="close-eliminar" class="text-pink-400 text-2xl font-bold">×</button>
                  </div>
                  <p id="eliminar-texto" class="text-cyan-200 mb-6"></p>
                  <div class="flex justify-end gap-4">
                    <button type="button" id="cancelar-eliminar" class="border-2 border-cyan-300 text-cyan-300 px-4 py-2 rounded-full font-bold hover:bg-cyan-300 hover:text-indigo-900 transition">Cancelar</button>
                    <button type="button" id="confirmar-eliminar" class="border-2 border-pink-400 text-pink-400 px-4 py-2 rounded-full font-bold hover:bg-pink-400 hover:text-white transition">Eliminar</button>
                  </div>
                </div>
              </div>
              <!-- Eliminado el formulario de gestión de productos que estaba en la mitad -->
            `;
            document.body.appendChild(adminContainer);
            // Lógica JS para cargar productos y manejar modales
            async function cargarProductosAdmin(filtro = '') {
              const res = await fetch('http://localhost:8000/api/products');
              const productos = await res.json();
              const lista = document.getElementById('admin-product-list');
              lista.innerHTML = '';
              productos.filter(p => p.name.toLowerCase().includes(filtro) || p.sku?.toLowerCase().includes(filtro) || p.categoria?.toLowerCase().includes(filtro)).forEach(producto => {
                lista.innerHTML += `
                  <tr>
                    <td class="px-4 py-2">${producto.id}</td>
                    <td class="px-4 py-2 font-bold">${producto.name}</td>
                    <td class="px-4 py-2"><img src="${producto.image_url}" alt="${producto.name}" class="h-12 w-12 object-cover rounded" /></td>
                    <td class="px-4 py-2">${producto.price}</td>
                    <td class="px-4 py-2">${producto.description}</td>
                    <td class="px-4 py-2">
                      <button class="border-2 border-pink-400 text-pink-400 px-2 py-1 rounded-full font-bold hover:bg-pink-400 hover:text-white transition btn-eliminar" data-id="${producto.id}" data-nombre="${producto.name}">Eliminar</button>
                      <button class="border-2 border-blue-400 text-blue-400 px-2 py-1 rounded-full font-bold hover:bg-blue-400 hover:text-white transition btn-editar" data-id="${producto.id}" data-nombre="${producto.name}">Editar</button>
                    </td>
                  </tr>
                `;
              });
            }
            cargarProductosAdmin();
            document.getElementById('btn-buscar').onclick = () => {
              const filtro = document.getElementById('search-bar').value.toLowerCase();
              cargarProductosAdmin(filtro);
            };
            document.getElementById('search-bar').oninput = (e) => {
              cargarProductosAdmin(e.target.value.toLowerCase());
            };
            // Modal nuevo producto
            document.getElementById('btn-nuevo').onclick = () => {
              document.getElementById('modal-nuevo').style.display = 'flex';
            };
            document.getElementById('close-nuevo').onclick = () => {
              document.getElementById('modal-nuevo').style.display = 'none';
            };
            document.getElementById('cancelar-nuevo').onclick = () => {
              document.getElementById('modal-nuevo').style.display = 'none';
            };
            document.getElementById('form-nuevo').onsubmit = async (e) => {
              e.preventDefault();
              const nombre = document.getElementById('nuevo-nombre').value;
              const descripcion = document.getElementById('nuevo-descripcion').value;
              const precio = document.getElementById('nuevo-precio').value;
              const imagenInput = document.getElementById('nuevo-imagen');
              if (!imagenInput.files[0]) {
                alert('La imagen es obligatoria');
                return;
              }
              // Subir imagen a Firebase Storage usando la API global
              const file = imagenInput.files[0];
              const storageRef = storage.ref('products/' + Date.now() + '_' + file.name);
              const uploadTask = storageRef.put(file);
              uploadTask.on('state_changed', null, function(error) {
                alert('Error al subir imagen');
              }, function() {
                uploadTask.snapshot.ref.getDownloadURL().then(async function(imageUrl) {
                  // Guardar producto en la BD
                  try {
                    const res = await fetch('http://localhost:8000/api/products', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        name: nombre,
                        description: descripcion,
                        price: precio,
                        image_url: imageUrl
                      })
                    });
                    if (!res.ok) throw new Error('Error al crear producto');
                  } catch (err) {
                    alert('Error al crear producto');
                  }
                  document.getElementById('modal-nuevo').style.display = 'none';
                  cargarProductosAdmin();
                });
              });
            };
            // Modal eliminar producto
            document.getElementById('admin-product-list').onclick = (e) => {
              if (e.target.classList.contains('btn-eliminar')) {
                document.getElementById('modal-eliminar').style.display = 'flex';
                document.getElementById('eliminar-texto').textContent = `¿Seguro que deseas eliminar ${e.target.dataset.nombre}?`;
                document.getElementById('confirmar-eliminar').onclick = async () => {
                  // Aquí puedes agregar la lógica para eliminar el producto en tu API
                  document.getElementById('modal-eliminar').style.display = 'none';
                  cargarProductosAdmin();
                };
              }
            };
            document.getElementById('close-eliminar').onclick = () => {
              document.getElementById('modal-eliminar').style.display = 'none';
            };
            document.getElementById('cancelar-eliminar').onclick = () => {
              document.getElementById('modal-eliminar').style.display = 'none';
            };
            // Editar producto
            window.editarProducto = function(id) {
              // Buscar producto actual
              const fila = Array.from(document.querySelectorAll('#admin-product-list tr')).find(tr => tr.querySelector('button').onclick.toString().includes(`editarProducto(${id})`));
              if (!fila) return;
              // Obtener datos actuales
              const nombre = fila.children[1].textContent;
              const precio = fila.children[3].textContent;
              const descripcion = fila.children[4].textContent;
              // Mostrar modal de nuevo pero con datos actuales
              document.getElementById('modal-nuevo').classList.remove('hidden');
              document.getElementById('nuevo-nombre').value = nombre;
              document.getElementById('nuevo-precio').value = precio;
              document.getElementById('nuevo-descripcion').value = descripcion;
              document.getElementById('form-nuevo').dataset.editId = id;
            };

            // Modificar submit del formulario para edición
            const formNuevo = document.getElementById('form-nuevo');
            if (formNuevo) {
              formNuevo.addEventListener('submit', async function(e) {
                e.preventDefault();
                const nombre = document.getElementById('nuevo-nombre').value;
                const precio = document.getElementById('nuevo-precio').value;
                const descripcion = document.getElementById('nuevo-descripcion').value;
                const imagen = document.getElementById('nuevo-imagen').files[0];
                const token = localStorage.getItem('authToken');
                const editId = formNuevo.dataset.editId;
                let imageUrl = null;
                if (imagen) {
                  const storageRef = storage.ref('products/' + Date.now() + '_' + imagen.name);
                  await storageRef.put(imagen);
                  imageUrl = await storageRef.getDownloadURL();
                }
                try {
                  let res;
                  if (editId) {
                    // Editar producto
                    const body = {
                      name: nombre,
                      description: descripcion,
                      price: precio
                    };
                    if (imageUrl) body.image_url = imageUrl;
                    res = await fetch(`http://localhost:8000/api/products/${editId}`, {
                      method: 'PUT',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                      },
                      body: JSON.stringify(body)
                    });
                  } else {
                    // Crear producto
                    if (!imagen) return alert('La imagen es obligatoria');
                    res = await fetch('http://localhost:8000/api/products', {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                      },
                      body: JSON.stringify({
                        name: nombre,
                        description: descripcion,
                        price: precio,
                        image_url: imageUrl
                      })
                    });
                  }
                  if (!res.ok) throw new Error(editId ? 'Error al editar producto' : 'Error al guardar producto');
                  alert(editId ? 'Producto editado' : 'Producto guardado');
                  document.getElementById('modal-nuevo').classList.add('hidden');
                  formNuevo.dataset.editId = '';
                  cargarProductos();
                } catch (err) {
                  alert('Error: ' + err.message);
                }
              });
            }
          } else {
            // Catálogo para usuario normal
            const catalogContainer = document.createElement('div');
            catalogContainer.id = 'catalog-container';
            catalogContainer.className = 'min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-900 to-gray-900';
            catalogContainer.innerHTML = `
              <h1 class="text-4xl font-extrabold mb-8 text-blue-300 drop-shadow">Catálogo de Productos</h1>
              <div class="mb-6 w-full max-w-3xl flex justify-center">
                <input id="search-bar" type="text" placeholder="Buscar productos..." class="w-full p-3 rounded border border-blue-400 text-black" />
              </div>
              <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 w-full max-w-5xl"></div>
            `;
            document.body.appendChild(catalogContainer);
            fetchProducts();
            document.getElementById('search-bar').addEventListener('input', async function(e) {
              const query = e.target.value.toLowerCase();
              try {
                const res = await fetch('http://localhost:8000/api/products');
                const productos = await res.json();
                const lista = document.getElementById('product-list');
                lista.innerHTML = '';
                productos.filter(producto => producto.name.toLowerCase().includes(query) || producto.description.toLowerCase().includes(query)).forEach(producto => {
                  const card = document.createElement('div');
                  card.className = 'bg-gray-800 rounded-lg shadow-lg p-6 flex flex-col items-center hover:scale-105 transition-transform duration-200';
                  card.innerHTML = `
                    <img src="${producto.image || 'https://via.placeholder.com/150'}" alt="${producto.name}" class="w-32 h-32 object-cover rounded mb-4 border-2 border-blue-400">
                    <h2 class='text-2xl font-bold mb-2 text-blue-200'>${producto.name}</h2>
                    <p class='mb-2 text-gray-300'>${producto.description}</p>
                    <span class='mt-2 text-lg font-bold text-blue-400'>${producto.price} €</span>
                    <button class='mt-4 bg-yellow-400 text-black px-4 py-2 rounded hover:bg-yellow-500' onclick='alert("Añadido a favoritos")'>⭐ Favorito</button>
                  `;
                  lista.appendChild(card);
                });
              } catch (err) {
                document.getElementById('product-list').innerHTML = '<p class="text-red-400">Error al cargar productos.</p>';
              }
            });
          }
        } else {
          alert('Credenciales inválidas.');
        }
      } catch (error) {
        console.error('Error al iniciar sesión:', error);
        alert('Error inesperado al intentar iniciar sesión.');
      }
    });

    document.getElementById('register-link').addEventListener('click', (e) => {
          // Función para mostrar catálogo simple de usuario
          function mostrarCatalogoUsuario() {
            const catalogo = document.createElement('div');
            catalogo.className = 'min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-blue-900 to-gray-900';
            catalogo.innerHTML = `
              <h1 class="text-4xl font-extrabold mb-8 text-blue-300 drop-shadow">Catálogo de Productos</h1>
              <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 w-full max-w-5xl"></div>
            `;
            document.body.appendChild(catalogo);
            async function cargarProductos() {
              try {
                const res = await fetch('http://localhost:8000/api/products');
                const productos = await res.json();
                const lista = document.getElementById('product-list');
                lista.innerHTML = '';
                productos.forEach(producto => {
                  const card = document.createElement('div');
                  card.className = 'bg-gray-800 rounded-lg shadow-lg p-6 flex flex-col items-center hover:scale-105 transition-transform duration-200';
                  card.innerHTML = `
                    <img src="${producto.image || 'https://via.placeholder.com/150'}" alt="${producto.name}" class="w-32 h-32 object-cover rounded mb-4 border-2 border-blue-400">
                    <h2 class='text-2xl font-bold mb-2 text-blue-200'>${producto.name}</h2>
                    <p class='mb-2 text-gray-300'>${producto.description}</p>
                    <span class='mt-2 text-lg font-bold text-blue-400'>${producto.price} €</span>
                  `;
                  lista.appendChild(card);
                });
              } catch (err) {
                document.getElementById('product-list').innerHTML = '<p class="text-red-400">Error al cargar productos.</p>';
              }
            }
            cargarProductos();
          }

          // Función para mostrar panel CRUD de administrador
          function mostrarCrudAdmin() {
            const crud = document.createElement('div');
            crud.className = 'min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-purple-900 to-gray-900';
            crud.innerHTML = `
              <h1 class="text-4xl font-extrabold mb-8 text-purple-300 drop-shadow">Panel CRUD de Productos y Usuarios</h1>
              <div class="mb-12 w-full max-w-5xl">
                <h2 class="text-2xl font-bold mb-6 text-purple-200">Productos</h2>
                <div id="crud-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div>
                <button onclick="crearProducto()" class="bg-blue-600 px-6 py-3 rounded mt-6 text-lg font-semibold hover:bg-blue-700 transition">Agregar Producto</button>
              </div>
              <div class="w-full max-w-5xl">
                <h2 class="text-2xl font-bold mb-6 text-purple-200">Usuarios</h2>
                <div id="crud-usuarios" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div>
              </div>
            `;
            document.body.appendChild(crud);
            async function cargarProductos() {
              try {
                const res = await fetch('http://localhost:8000/api/products');
                const productos = await res.json();
                const lista = document.getElementById('crud-productos');
                lista.innerHTML = '';
                productos.forEach(producto => {
                  const card = document.createElement('div');
                  card.className = 'bg-gray-800 rounded-lg shadow-lg p-6 flex flex-col items-center hover:scale-105 transition-transform duration-200';
                  card.innerHTML = `
                    <img src="${producto.image || 'https://via.placeholder.com/150'}" alt="${producto.name}" class="w-24 h-24 object-cover rounded mb-3 border-2 border-purple-400">
                    <h3 class='text-xl font-bold mb-1 text-purple-200'>${producto.name}</h3>
                    <p class='mb-1 text-gray-300'>${producto.description}</p>
                    <span class='mb-2 text-lg font-bold text-purple-400'>${producto.price} €</span>
                    <div class='flex gap-2 mt-2'>
                      <button onclick='editarProducto(${producto.id})' class='bg-yellow-500 px-3 py-1 rounded font-semibold hover:bg-yellow-600 transition'>Editar</button>
                      <button onclick='eliminarProducto(${producto.id})' class='bg-red-600 px-3 py-1 rounded font-semibold hover:bg-red-700 transition'>Eliminar</button>
                    </div>
                  `;
                  lista.appendChild(card);
                });
              } catch (err) {
                document.getElementById('crud-productos').innerHTML = '<p class="text-red-400">Error al cargar productos.</p>';
              }
            }
            async function cargarUsuarios() {
              try {
                const res = await fetch('http://localhost:8000/api/users');
                const usuarios = await res.json();
                const lista = document.getElementById('crud-usuarios');
                lista.innerHTML = '';
                usuarios.forEach(usuario => {
                  const card = document.createElement('div');
                  card.className = 'bg-gray-800 rounded-lg shadow-lg p-6 flex flex-col items-center hover:scale-105 transition-transform duration-200';
                  card.innerHTML = `
                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(usuario.name)}&background=6b21a8&color=fff&size=128" alt="${usuario.name}" class="w-20 h-20 object-cover rounded-full mb-3 border-2 border-purple-400">
                    <h3 class='text-lg font-bold mb-1 text-purple-200'>${usuario.name}</h3>
                    <p class='mb-1 text-gray-300'>${usuario.email}</p>
                    <span class='mb-2 text-md font-bold text-purple-400'>Rol: ${usuario.role}</span>
                    <div class='flex gap-2 mt-2'>
                      <button onclick='editarUsuario(${usuario.id})' class='bg-yellow-500 px-3 py-1 rounded font-semibold hover:bg-yellow-600 transition'>Editar</button>
                      <button onclick='eliminarUsuario(${usuario.id})' class='bg-red-600 px-3 py-1 rounded font-semibold hover:bg-red-700 transition'>Eliminar</button>
                    </div>
                  `;
                  lista.appendChild(card);
                });
              } catch (err) {
                document.getElementById('crud-usuarios').innerHTML = '<p class="text-red-400">Error al cargar usuarios.</p>';
              }
            }
            function crearProducto() {
              alert('Función para crear producto (implementa tu lógica aquí)');
            }
            function editarProducto(id) {
              alert('Editar producto ' + id);
            }
            function eliminarProducto(id) {
              alert('Eliminar producto ' + id);
            }
            function editarUsuario(id) {
              alert('Editar usuario ' + id);
            }
            function eliminarUsuario(id) {
              alert('Eliminar usuario ' + id);
            }
            cargarProductos();
            cargarUsuarios();
          }
      e.preventDefault();

      const registerContainer = document.createElement('div');
      registerContainer.className = 'login-container';

      registerContainer.innerHTML = `
        <h1>REGISTRARSE</h1>
        <form id="register-form">
          <label for="register-name">Nombre:</label>
          <input type="text" id="register-name" required />

          <label for="register-email">Email:</label>
          <input type="email" id="register-email" required />

          <label for="register-password">Contraseña:</label>
          <input type="password" id="register-password" required />

          <label for="register-role">Rol:</label>
          <select id="register-role" required>
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
          </select>

          <button type="submit">Registrarse</button>
        </form>
      `;

      document.body.innerHTML = '';
      document.body.appendChild(registerContainer);

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const role = document.getElementById('register-role').value;

        try {
          const response = await fetch('http://localhost:8000/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ name, email, password, role }), // Enviar datos a la base de datos
          });

          if (!response.ok) {
            throw new Error('Error al registrarse');
          }

          const data = await response.json();
          alert('Registro exitoso. Ahora puedes iniciar sesión.');
          document.body.innerHTML = ''; // Limpiar el contenido actual
          document.body.appendChild(document.querySelector('.login-container')); // Volver a mostrar el formulario de login
        } catch (error) {
          alert('Error: ' + error.message);
        }
      });
    });
  </script>
</body>
