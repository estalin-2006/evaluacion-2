<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mini Catálogo</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
        font-family: Inter, sans-serif;
        color: #fff;
    }
    .card {
        background: rgba(0,0,0,0.75);
        border-radius: 1rem;
        padding: 1rem;
        transition: transform 0.3s, box-shadow 0.3s;
        border: 2px solid #4ade80;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(74, 222, 128, 0.6);
    }
    input, button {
        outline: none;
        transition: 0.2s;
    }
    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 5px #3b82f6;
    }
    button:hover {
        opacity: 0.9;
    }
</style>
</head>
<body class="p-6">

<header class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-green-400">Panel Admin</h1>
    <button id="btn-logout" class="bg-red-600 px-4 py-2 rounded-lg font-semibold">Cerrar sesión</button>
</header>

<section class="mb-6 p-4 bg-gray-900 rounded-xl border-2 border-blue-500 shadow-lg">
    <h2 class="text-xl font-bold mb-4 text-blue-400">Agregar Producto</h2>
    <div class="grid grid-cols-1 gap-3 w-full md:w-1/2">
        <input type="text" id="prod-nombre" placeholder="Nombre" class="p-2 rounded-lg text-black">
        <input type="text" id="prod-descripcion" placeholder="Descripción" class="p-2 rounded-lg text-black">
        <input type="number" id="prod-precio" placeholder="Precio" class="p-2 rounded-lg text-black">
        <input type="file" id="prod-img" class="text-white">
        <button id="btn-agregar" class="bg-green-500 py-2 rounded-lg font-bold">Agregar Producto</button>
    </div>
</section>

<section>
    <h2 class="text-xl font-bold mb-3 text-blue-400">Productos</h2>
    <input type="text" id="filtro" placeholder="Filtrar productos" class="p-2 rounded-lg text-black mb-4 w-full md:w-1/2">
    <div id="lista-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>

<script type="module">
import { cargarProductosAdmin, agregarProductoAdmin, logout } from './catalog.js';

document.getElementById("btn-logout").addEventListener("click", logout);
document.getElementById("btn-agregar").addEventListener("click", agregarProductoAdmin);
document.getElementById("filtro").addEventListener("input", (e) => cargarProductosAdmin(e.target.value));

cargarProductosAdmin();
</script>

</body>
</html>
