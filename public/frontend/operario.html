<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operario - Mini Catálogo</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
        font-family: Inter, sans-serif;
        color: #fff;
    }
    .card {
        background: rgba(0,0,0,0.75);
        border-radius: 1rem;
        padding: 1rem;
        transition: transform 0.3s, box-shadow 0.3s;
        border: 2px solid #3b82f6;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.6);
    }
    button:hover {
        opacity: 0.9;
    }
    input:focus {
        border-color: #10b981;
        box-shadow: 0 0 5px #10b981;
    }
</style>
</head>
<body class="p-6">

<header class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-green-400">Panel Operario</h1>
    <button id="btn-logout" class="bg-red-600 px-4 py-2 rounded-lg font-semibold">Cerrar sesión</button>
</header>

<!-- Frase motivacional -->
<div id="api-info" class="p-2 mt-4 text-yellow-400 font-semibold text-center">Cargando frase...</div>

<section>
    <h2 class="text-xl font-bold mb-3 text-blue-400">Productos</h2>
    <input type="text" id="filtro" placeholder="Filtrar productos" class="p-2 rounded-lg text-black mb-4 w-full md:w-1/2">
    <div id="lista-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>

<script type="module">
import { cargarProductosOperario, logout } from './catalog.js';

// Logout
document.getElementById("btn-logout").addEventListener("click", logout);

// Filtro de productos
document.getElementById("filtro").addEventListener("input", (e) => cargarProductosOperario(e.target.value));
cargarProductosOperario();

// ===============================
// API externa: frases motivacionales
// ===============================
async function cargarFrase() {
    const apiInfoDiv = document.getElementById("api-info");
    try {
        const url = encodeURIComponent("https://type.fit/api/quotes");
        const res = await fetch(`https://api.allorigins.win/get?url=${url}`);
        const data = await res.json();
        const quotes = JSON.parse(data.contents);

        if (Array.isArray(quotes) && quotes.length > 0) {
            const frase = quotes[Math.floor(Math.random() * quotes.length)].text;
            apiInfoDiv.textContent = `"${frase}"`;
        } else {
            apiInfoDiv.textContent = "No se pudo cargar la frase";
        }
    } catch (e) {
        console.error("Error API externa:", e);
        apiInfoDiv.textContent = "Error al obtener la frase";
    }
}

// Cargar la frase al abrir la página
cargarFrase();
</script>

</body>
</html>
